name: Import source from comments
on:
  issue_comment:
    types: [created]
permissions:
  contents: write
  pull-requests: read
  issues: read
jobs:
  import:
    if: github.event.issue.pull_request && startsWith(github.event.comment.body, 'SFJ2_DONE:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct and commit source
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.issue.number }}
          EXPECTED: 06b0175af19326c8f72cd44f969278824c29d263c1ffcb4e271879d721e1bf54
        shell: bash
        run: |
          set -euo pipefail
          head=$(gh pr view "$PR" --json headRefName -q .headRefName)
          gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments?per_page=100" > /tmp/comments.json
          python3 - <<'PY'
          import json, os, pathlib
          rows=json.load(open('/tmp/comments.json'))
          parts={}
          for r in rows:
              b=r.get('body','')
              if b.startswith('SFJ2_PART_'):
                  tag,data=b.split(':',1)
                  parts[int(tag.removeprefix('SFJ2_PART_'))]=data.strip()
          if sorted(parts) != list(range(14)):
              raise SystemExit(f'expected parts 0..13, got {sorted(parts)}')
          pathlib.Path('/tmp/project.b64').write_text(''.join(parts[i] for i in range(14)))
          PY
          base64 -d /tmp/project.b64 > /tmp/project.tar.xz
          echo "$EXPECTED  /tmp/project.tar.xz" | sha256sum -c --strict
          rm -rf /tmp/import && mkdir /tmp/import
          tar -xJf /tmp/project.tar.xz -C /tmp/import
          git fetch origin "$head"
          git checkout -B "$head" "origin/$head"
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/import/simple-federated-jdbc/. .
          chmod +x scripts/*.sh
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          test -f pom.xml
          test -d src/main/java
          test -d src/test/java
          test "$(git ls-files | wc -l)" -ge 200
          git commit -m 'Import Simple Federated JDBC source'
          git push --force-with-lease origin "$head"
