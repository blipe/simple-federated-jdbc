name: Bootstrap project PR
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
permissions:
  contents: write
jobs:
  bootstrap-and-verify:
    if: github.event.pull_request.head.ref == 'agent/real-maven-validation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, ref: agent/real-maven-validation}
      - name: Reconstruct verified source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,hashlib,pathlib
          sizes=[20000]*8+[16492]
          hashes=['8f709013db0c4470af2d40f55bcb180cb3cf11e4b0aff9ce6bca5ccabaaa6c4c','ee55486c3bc7c4423270ac92d635f2492732020556b1228e14ec473aff6d6831','0b1f3dbab30d40b22b371e55ed50dd82f40b5978556c2829ac9fa8d3195d12be','91ca2f8f0fccfec19ea7734351d9587d98528b9fb3bd25d3172a11b77fbde110','ed16424b67217c8ab94607614ff061322320adb3e6666cd1d61a954e35b360dc','3abcc3eb852c7e4b06eff153742dfa358ab98607914e57f53f81ab2d2df0cc3d','3b6698e6e18a165e4bfe9b70ed63e3d38088e6e607043f6093039ea61aa8a8ad','4b43845efd87991d7329322c39c337077ca731ba2b2da61015eb720f7c6fa5b3','df62963b7035cde24a4636b6d88a9aef4fd4be019e6640117efa245c6e1f3afb']
          blockhash=['6c79c9194eb35edc512c43104545e6b566c0910ccbe982723b568674171ebadf','77f9becaf664d77a5486e62d251fc5f2628bc8e78f58c066be1a75952622545d','73ab496b02155049e1db1017260e91d1c44c991dd4d9d638bf5e93e768a37e18','fb45522b9ad108d65ad65eb45c05a99f6502010af6b89937edbe123cc92703e7','066e4c931ebec7a11359f39fefd06ef89c2935453feb5ffc58ed2b0033de778a','c6d3b44aaa1674b8360cad3eb72bd0b0bd17b94f68bcd333b9cac2ea50dc814e','741c7edbf38601b8653ed5a7b501de8297f007a8c70ac88f92da1b3129159a09','61730a9fddec8f0f45db4e9da1800573f7238172467ef3a12764d211d95144a7','6e0beb0e4171dcb6ac4e9386ca1c2d7fded850b2c7800b550eb4e6f431803276','6a7786df595f50a2012f045e1341c8993dfc5fcd9d23403db33935d3bbc5ed1e']
          alpha='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/'
          ref=b''.join(pathlib.Path('.bootstrap-core/part-001-block-005.exact').read_bytes().split()).decode()
          repaired=[]
          for pos in range(len(ref)+1):
              for ch in alpha:
                  b=ref[:pos]+ch+ref[pos:]
                  if all(hashlib.sha256(b[j*100:(j+1)*100].encode()).hexdigest()==blockhash[j] for j in range(10)):
                      repaired.append(b)
          if len(repaired)!=1: raise SystemExit(f'1000-byte repair candidates={len(repaired)}')
          out=[]
          for i in range(9):
              s=b''.join(pathlib.Path(f'.bootstrap-core/part-{i:03}.b64').read_bytes().split()).decode(); size=sizes[i]; want=hashes[i]
              if i==1: s=s[:5000]+repaired[0]+s[5999:]
              if len(s)>size and hashlib.sha256(s[:size].encode()).hexdigest()==want: s=s[:size]
              if len(s)!=size or hashlib.sha256(s.encode()).hexdigest()!=want: raise SystemExit(f'chunk {i} mismatch len={len(s)}')
              out.append(s)
          pathlib.Path('/tmp/core.tar.xz').write_bytes(base64.b64decode(''.join(out),validate=True))
          PY
          echo '44d418c7c4a3f16cd7f642d98e86b5e3bffdd419b6dd35ee505e515d9982aec8  /tmp/core.tar.xz' | sha256sum -c --strict
          rm -rf /tmp/core && mkdir /tmp/core && tar -xJf /tmp/core.tar.xz -C /tmp/core
          cp -a /tmp/core/pom.xml /tmp/core/src /tmp/core/scripts . && chmod +x scripts/*.sh
      - name: Commit source files
        run: |
          rm -rf .bootstrap .bootstrap-core
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A && git commit -m 'Import Simple Federated JDBC source'
          git push origin HEAD:agent/real-maven-validation
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21', cache: maven}
      - run: mvn -B -ntp -e clean verify
