name: Diagnose bootstrap chunk

on:
  pull_request:
    branches: [main]
    types: [reopened]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event.pull_request.head.ref == 'agent/real-maven-validation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Locate damaged block
        run: |
          python3 - <<'PY'
          import hashlib, pathlib
          expected = [
          '6c79c9194eb35edc512c43104545e6b566c0910ccbe982723b568674171ebadf',
          '77f9becaf664d77a5486e62d251fc5f2628bc8e78f58c066be1a75952622545d',
          '73ab496b02155049e1db1017260e91d1c44c991dd4d9d638bf5e93e768a37e18',
          'fb45522b9ad108d65ad65eb45c05a99f6502010af6b89937edbe123cc92703e7',
          '066e4c931ebec7a11359f39fefd06ef89c2935453feb5ffc58ed2b0033de778a',
          'c6d3b44aaa1674b8360cad3eb72bd0b0bd17b94f68bcd333b9cac2ea50dc814e',
          '741c7edbf38601b8653ed5a7b501de8297f007a8c70ac88f92da1b3129159a09',
          '61730a9fddec8f0f45db4e9da1800573f7238172467ef3a12764d211d95144a7',
          '6e0beb0e4171dcb6ac4e9386ca1c2d7fded850b2c7800b550eb4e6f431803276',
          '6a7786df595f50a2012f045e1341c8993dfc5fcd9d23403db33935d3bbc5ed1e']
          current = b''.join(pathlib.Path('.bootstrap-core/part-001.b64').read_bytes().split()).decode()
          for index, digest in enumerate(expected):
              start = 5000 + index * 100
              actual = hashlib.sha256(current[start:start+100].encode()).hexdigest()
              print(index, actual, 'OK' if actual == digest else 'MISMATCH')
              if actual != digest:
                  break
          PY
